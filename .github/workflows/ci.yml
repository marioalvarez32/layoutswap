name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: vue-tsc
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      - name: Clippy
        run: pnpm lint:rust

      - name: cargo test
        run: pnpm test:rust

      - name: The TypeScript bindings match the Rust types
        run: git diff --exit-code -- src/domain/generated/types.ts
