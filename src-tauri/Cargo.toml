[package]
name = "layoutswap"
version = "0.1.0"
description = "Switch between saved monitor layouts on Windows"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "layoutswap_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-compat"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
rfd = { version = "0.17.2", default-features = false }
dirs = "7.0.0"

[dev-dependencies]
tempfile = "3"
